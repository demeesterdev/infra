apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-app
  namespace: cert-manager
spec:
  interval: 1h
  retryInterval: 1m
  targetNamespace: cert-manager
  path: ./infrastructure/cert-manager/app
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: cert-manager
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
    - name: cert-manager-app
  targetNamespace: cert-manager
  path: ./infrastructure/cert-manager/config
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: transip-secret
